<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100%;
  }
  #intro-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 900ms ease;
  }
  #intro-wrap canvas {
    display: block;
  }
  #intro-word {
    position: absolute;
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: __TEXT_COLOR__;
    opacity: 0.92;
    pointer-events: none;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="intro-wrap">
    <div id="intro-word">&#129504;&nbsp; SkillSync</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      var wrap = document.getElementById('intro-wrap');
      var prefersReducedMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Accessibility requirement from the brief: skip the animation
      // entirely (no rotation, no camera drift) if the OS/browser asks
      // for reduced motion. We still show the static wordmark briefly so
      // the reserved space isn't just a blank rectangle, then fade it --
      // nothing moves.
      if (prefersReducedMotion || typeof THREE === 'undefined') {
        setTimeout(function () { wrap.style.opacity = '0'; }, 700);
        return;
      }

      var width = window.innerWidth;
      var height = window.innerHeight;

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.z = 9;

      var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      wrap.insertBefore(renderer.domElement, document.getElementById('intro-word'));

      scene.add(new THREE.AmbientLight(0xffffff, 0.65));
      var point = new THREE.PointLight(0xffffff, 0.85);
      point.position.set(5, 5, 8);
      scene.add(point);

      // The indigo -> violet -> pink gradient identity from the CSS theme.
      var palette = [0x4F46E5, 0x6D4FE0, 0x7C3AED, 0xA83FBE, 0xDB2777];
      var group = new THREE.Group();
      var orbs = [];

      for (var i = 0; i < 5; i++) {
        var color = palette[i % palette.length];
        var radius = 0.65 + Math.random() * 0.85;

        var core = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 32, 32),
          new THREE.MeshPhysicalMaterial({
            color: color,
            roughness: 0.3,
            metalness: 0.1,
            transparent: true,
            opacity: 0.92
          })
        );

        // No bloom post-processing -- two larger, more transparent shells
        // behind the core fake a soft glow cheaply instead.
        var glowInner = new THREE.Mesh(
          new THREE.SphereGeometry(radius * 1.28, 24, 24),
          new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.16 })
        );
        var glowOuter = new THREE.Mesh(
          new THREE.SphereGeometry(radius * 1.65, 20, 20),
          new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.06 })
        );

        var orbGroup = new THREE.Group();
        orbGroup.add(glowOuter, glowInner, core);

        var angle = (i / 5) * Math.PI * 2;
        var dist = 2.5 + Math.random() * 0.7;
        orbGroup.position.set(
          Math.cos(angle) * dist,
          Math.sin(angle) * dist * 0.55,
          (Math.random() - 0.5) * 2.2
        );

        orbs.push({
          group: orbGroup,
          speed: 0.15 + Math.random() * 0.18,
          floatOffset: Math.random() * Math.PI * 2
        });
        group.add(orbGroup);
      }
      scene.add(group);

      // Subtle parallax on mouse move (nice-to-have from the brief).
      var mouseX = 0, mouseY = 0;
      wrap.addEventListener('mousemove', function (e) {
        mouseX = (e.clientX / width) - 0.5;
        mouseY = (e.clientY / height) - 0.5;
      });

      var start = Date.now();
      var totalMs = 3200;  // scene runs ~3.2s before starting its own fade
      var fading = false;

      function animate() {
        var elapsed = Date.now() - start;

        group.rotation.y += 0.0025;
        group.rotation.x += (mouseY * 0.25 - group.rotation.x) * 0.03;
        camera.position.x += (mouseX * 1.1 - camera.position.x) * 0.04;
        camera.position.y += (-mouseY * 1.1 - camera.position.y) * 0.04;
        camera.lookAt(scene.position);

        var t = elapsed / 1000;
        orbs.forEach(function (o) {
          o.group.position.y += Math.sin(t * o.speed + o.floatOffset) * 0.0015;
        });

        renderer.render(scene, camera);

        if (elapsed < totalMs) {
          requestAnimationFrame(animate);
        } else if (!fading) {
          fading = true;
          wrap.style.opacity = '0';
        }
      }
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
